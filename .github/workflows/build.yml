name: 打包 macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      RELEASES_REPO: ${{ github.repository_owner }}/ezchm-releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 设置版本号和更新地址
        run: |
          V="0.1.${{ github.run_number }}"
          node -e '
            const f = "src-tauri/tauri.conf.json";
            const c = require("./" + f);
            c.version = process.argv[1];
            c.plugins.updater.endpoints = [`https://github.com/${process.argv[2]}/releases/latest/download/latest.json`];
            require("fs").writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          ' "$V" "$RELEASES_REPO"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: 打包
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --target universal-apple-darwin
          else
            npx tauri build --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: 发布到 ezchm-releases
        if: env.RELEASES_TOKEN != '' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          B="src-tauri/target/universal-apple-darwin/release/bundle"
          V="$APP_VERSION"
          R="$RELEASES_REPO"
          mkdir -p rel
          cp "$B"/dmg/*.dmg "rel/ezchm_${V}_universal.dmg"
          cp "$B"/macos/*.app.tar.gz rel/ezchm_universal.app.tar.gz
          SIG=$(cat "$B"/macos/*.app.tar.gz.sig)
          URL="https://github.com/$R/releases/download/v$V/ezchm_universal.app.tar.gz"
          node -e '
            const [v, sig, url] = process.argv.slice(1);
            const p = { signature: sig, url };
            require("fs").writeFileSync("rel/latest.json", JSON.stringify({ version: v, notes: "", pub_date: new Date().toISOString(), platforms: { "darwin-aarch64": p, "darwin-x86_64": p, "darwin-universal": p } }, null, 2));
          ' "$V" "$SIG" "$URL"
          gh release create "v$V" rel/* -R "$R" --target main --title "Ezchm $V" --notes "在 Ezchm 里点「更新」即可；手动安装就把 dmg 里的 Ezchm 拖进「应用程序」覆盖旧版，书架、书签和设置都不受影响。"

      - name: 整理产物
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/ezchm_${APP_VERSION}_universal.dmg"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ezchm-dmg
          path: out/*.dmg
          retention-days: 30
